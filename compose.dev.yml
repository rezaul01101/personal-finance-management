services:

  # =====================================================
  # Laravel PHP-FPM
  # =====================================================

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev

    container_name: laravel_app

    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      - ./:/var/www/html

    env_file:
      - .env

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_started

    networks:
      - laravel


  # =====================================================
  # Nginx
  # =====================================================

  nginx:
    image: nginx:1.27-alpine

    container_name: laravel_nginx

    restart: unless-stopped

    ports: !override
      - "8080:80"

    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    networks:
      - laravel


  # =====================================================
  # MySQL
  # =====================================================

  mysql:
    image: mysql:8.4

    container_name: laravel_mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: personal_finance_management
      MYSQL_USER: rezaul
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root-secret

    ports:
      - "3307:3306"

    volumes:
      - mysql_dev_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -proot-secret"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    networks:
      - laravel


  # =====================================================
  # Redis
  # =====================================================

  redis:
    image: redis:7-alpine

    container_name: laravel_redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_dev_data:/data

    networks:
      - laravel


  # =====================================================
  # Node / Vite
  # =====================================================

  node:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev

    user: root

    container_name: laravel_node

    working_dir: /var/www/html

    volumes:
      - ./:/var/www/html

      # Keep node_modules inside Docker
      - node_modules:/var/www/html/node_modules

    ports:
      - "5173:5173"

    command: npm run dev -- --host 0.0.0.0

    networks:
      - laravel


# =======================================================
# Networks
# =======================================================

networks:
  laravel:
    driver: bridge


# =======================================================
# Persistent Volumes
# =======================================================

volumes:

  mysql_dev_data:
    driver: local

  redis_dev_data:
    driver: local

  node_modules:
    driver: local